```html
<!DOCTYPE html>
<html lang="es">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rifa Premium</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

<style>
body{
  font-family:'Poppins',sans-serif;
  background:linear-gradient(135deg,#0f172a,#1e293b);
  color:white;
  margin:0;
}

header{
  background:rgba(34,197,94,0.9);
  padding:15px;
  text-align:center;
  font-weight:700;
}

.container{padding:15px;max-width:1000px;margin:auto}

.card{
  background:rgba(255,255,255,0.05);
  border-radius:15px;
  padding:15px;
  margin-bottom:15px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(70px,1fr));
  gap:10px;
}

.num{
  padding:12px;
  border-radius:12px;
  text-align:center;
  cursor:pointer;
  font-weight:bold;
}

.libre{background:#22c55e}
.pendiente{background:#f59e0b;cursor:not-allowed;opacity:0.7}
.pagado{background:#ef4444;cursor:not-allowed;opacity:0.7}

.seleccionado{
  transform:scale(1.1);
  box-shadow:0 0 10px yellow;
}

/* EFECTO BLOQUEO */
.bloqueado-efecto{
  animation:shake 0.3s;
}
@keyframes shake{
  0%{transform:translateX(0)}
  25%{transform:translateX(-3px)}
  50%{transform:translateX(3px)}
  75%{transform:translateX(-3px)}
  100%{transform:translateX(0)}
}

/* TOAST */
.toast{
  position:fixed;
  bottom:20px;
  left:50%;
  transform:translateX(-50%);
  background:#ef4444;
  color:white;
  padding:10px 20px;
  border-radius:10px;
  opacity:0;
  transition:0.3s;
}
.toast.show{opacity:1}

button{
  width:100%;
  padding:12px;
  border:none;
  border-radius:12px;
  background:#22c55e;
  color:white;
  font-weight:bold;
  margin-top:10px;
}

.qr img{width:180px;background:white;padding:10px;border-radius:10px}

</style>
</head>

<body>

<header>🎟️ RIFA SOLIDARIA</header>

<div class="container">

<div class="card">
<h2>🎯 ESCOGE TU NÚMERO</h2>
<div id="totalBox">Seleccionados: 0 | Total: $0</div>
<button onclick="comprar()">💳 Comprar</button>

<div id="pagoBox" style="display:none;text-align:center;">
<h3>Escanea para pagar</h3>
<img src="qr.png">
</div>
</div>

<div class="card">
<div id="grid" class="grid"></div>
</div>

</div>

<div id="toast" class="toast">🚫 Número no disponible</div>

<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

<script>
const firebaseConfig={
apiKey:"TU_API",
databaseURL:"TU_DATABASE"
};

firebase.initializeApp(firebaseConfig);
const db=firebase.database();

let seleccionados=[];
const precio=5;
const total=500;
const numeroWhatsApp="593XXXXXXXXX";

function cargar(){
let grid=document.getElementById("grid");
for(let i=1;i<=total;i++){
let d=document.createElement("div");
d.className="num libre";
d.innerText=i;
d.onclick=()=>seleccionar(i);
grid.appendChild(d);
}
cargarDatos();
}

function seleccionar(n){
let el=[...document.querySelectorAll(".num")]
.find(d=>parseInt(d.innerText)===n);

// BLOQUEO PRO
if(!el.classList.contains("libre")){
el.classList.add("bloqueado-efecto");
setTimeout(()=>el.classList.remove("bloqueado-efecto"),300);

let t=document.getElementById("toast");
t.classList.add("show");
setTimeout(()=>t.classList.remove("show"),1500);

return;
}

if(seleccionados.includes(n)){
seleccionados=seleccionados.filter(x=>x!==n);
}else{
seleccionados.push(n);
}
actualizarUI();
}

function actualizarUI(){
document.querySelectorAll(".num").forEach(d=>{
let n=parseInt(d.innerText);
d.classList.toggle("seleccionado",seleccionados.includes(n));
});
document.getElementById("totalBox").innerText=
"Seleccionados: "+seleccionados.length+" | Total: $"+(seleccionados.length*precio);
}

function comprar(){
if(seleccionados.length==0)return alert("Selecciona números");

let nombre=prompt("Nombre:");
let tel=prompt("Tel:");
if(!nombre||!tel)return;

let totalP=seleccionados.length*precio;

seleccionados.forEach(n=>{
db.ref("rifa/"+n).set({nombre,tel,estado:"pendiente"});
});

document.getElementById("pagoBox").style.display="block";

let msg=encodeURIComponent(
"Compra rifa\nNombre:"+nombre+
"\nTel:"+tel+
"\nNums:"+seleccionados.join(",")+
"\nTotal:$"+totalP
);

window.open("https://wa.me/"+0987838871+"?text="+msg);

seleccionados=[];
actualizarUI();
}

function cargarDatos(){
db.ref("rifa").on("value",snap=>{
let data=snap.val()||{};

for(let n in data){
document.querySelectorAll(".num").forEach(d=>{
if(d.innerText==n){
d.className="num "+(data[n].estado=="pagado"?"pagado":"pendiente");
}
});
}
});
}

cargar();
</script>

</body>
</html>
