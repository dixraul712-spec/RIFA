<!DOCTYPE html>
<html lang="es">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rifa Premium</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

<style>
body{
  font-family:'Poppins',sans-serif;
  background:linear-gradient(135deg,#0f172a,#1e293b);
  color:white;
  margin:0;
}

header{
  background:#22c55e;
  padding:15px;
  text-align:center;
  font-weight:700;
  font-size:18px;
}

.container{padding:15px;max-width:1000px;margin:auto}

.card{
  background:rgba(255,255,255,0.05);
  border-radius:15px;
  padding:15px;
  margin-bottom:15px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(70px,1fr));
  gap:10px;
}

.num{
  padding:12px;
  border-radius:12px;
  text-align:center;
  cursor:pointer;
  font-weight:bold;
}

.libre{background:#22c55e}
.pendiente{background:#f59e0b; cursor:not-allowed; opacity:0.7}
.pagado{background:#ef4444; cursor:not-allowed; opacity:0.7}

.seleccionado{
  transform:scale(1.1);
  box-shadow:0 0 10px yellow;
}

button{
  width:100%;
  padding:12px;
  border:none;
  border-radius:12px;
  background:#22c55e;
  color:white;
  font-weight:bold;
  margin-top:10px;
}

.qr{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:20px;
  flex-wrap:wrap;
}

.qr img{
  width:180px;
  background:white;
  padding:10px;
  border-radius:10px;
}

.datos{
  background:rgba(0,0,0,0.4);
  padding:12px;
  border-radius:10px;
  font-size:14px;
  max-width:250px;
}

.total{font-weight:bold}
</style>
</head>

<body>

<header>🎟️ ESCOGE TU NÚMERO</header>

<div class="container">

<div class="card">
<h2>🎮 PlayStation 5</h2>
<h2>💻 CPU NUC COMPLETA</h2>
<p>$5 por número</p>
<p>Vendidos: <b id="vendidos">0</b></p>
</div>

<div class="card">
<div id="totalBox" class="total">Seleccionados: 0 | Total: $0</div>
<button onclick="comprar()">💳 Comprar ahora</button>

<div id="pagoBox" class="qr" style="display:none;">

<img src="qr.png">

<div class="datos">
<b>DATOS DE PAGO</b><br><br>
👤 <b>LUIS ALVEAR</b><br>
🏦 Cuenta de Ahorros - Pichincha<br>
💳 2204309484<br>
📱 0987838871<br><br>
⚠️ <b>RECUERDA ENVIAR EL COMPROBANTE AL WHATSAPP</b>
</div>

</div>

</div>

<div class="card">
<div id="grid" class="grid"></div>
</div>

</div>

<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

<script>
const firebaseConfig={
apiKey:"AIzaSyBoCNV94pAyGK7bhNE5rVjqOPI40JB4sXQ",
authDomain:"rifa-6dd5b.firebaseapp.com",
databaseURL:"https://rifa-6dd5b-default-rtdb.firebaseio.com",
projectId:"rifa-6dd5b"
};

firebase.initializeApp(firebaseConfig);
const db=firebase.database();

let seleccionados=[];
const precio=5;
const total=500;
const numeroWhatsApp="593987838871";

function cargar(){
let grid=document.getElementById("grid");
for(let i=1;i<=total;i++){
let d=document.createElement("div");
d.className="num libre";
d.innerText=i;
d.onclick=()=>seleccionar(i);
grid.appendChild(d);
}
cargarDatos();
}

// 🔥 BLOQUEO PRO
function seleccionar(n){
let elemento=document.querySelectorAll(".num")[n-1];

if(elemento.classList.contains("pendiente") || elemento.classList.contains("pagado")){
alert("❌ Este número ya no está disponible");
return;
}

if(seleccionados.includes(n)){
seleccionados=seleccionados.filter(x=>x!==n);
}else{
seleccionados.push(n);
}

actualizarUI();
}

function actualizarUI(){
document.querySelectorAll(".num").forEach(d=>{
let n=parseInt(d.innerText);
d.classList.toggle("seleccionado",seleccionados.includes(n));
});
document.getElementById("totalBox").innerText=
"Seleccionados: "+seleccionados.length+" | Total: $"+(seleccionados.length*precio);
}

function comprar(){
if(seleccionados.length==0)return alert("Selecciona números");

let nombre=prompt("Nombre:");
let tel=prompt("Teléfono:");
if(!nombre||!tel)return;

let totalP=seleccionados.length*precio;

seleccionados.forEach(n=>{
db.ref("rifa/"+n).set({
nombre,tel,estado:"pendiente"
});
});

document.getElementById("pagoBox").style.display="flex";

let msg=encodeURIComponent(
"Compra rifa\nNombre:"+nombre+
"\nTel:"+tel+
"\nNums:"+seleccionados.join(",")+
"\nTotal:$"+totalP
);

window.open("https://wa.me/"+numeroWhatsApp+"?text="+msg);

seleccionados=[];
actualizarUI();
}

function cargarDatos(){
db.ref("rifa").on("value",snap=>{
let data=snap.val()||{};
let c=0;

for(let n in data){
c++;
document.querySelectorAll(".num").forEach(d=>{
if(d.innerText==n){
d.className="num "+(data[n].estado=="pagado"?"pagado":"pendiente");
}
});
}

document.getElementById("vendidos").innerText=c;
});
}

cargar();
</script>

</body>
</html>
