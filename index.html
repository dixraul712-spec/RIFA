<!DOCTYPE html>
<html lang="es">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rifa Premium</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

<style>
body{
  font-family:'Poppins',sans-serif;
  background:linear-gradient(135deg,#0f172a,#1e293b);
  color:white;
  margin:0;
}

/* HEADER */
header{
  background:rgba(34,197,94,0.9);
  backdrop-filter:blur(10px);
  padding:15px;
  text-align:center;
  font-weight:700;
  font-size:18px;
  position:sticky;
  top:0;
}

/* CONTAINER */
.container{padding:15px;max-width:1000px;margin:auto}

/* CARD */
.card{
  background:rgba(255,255,255,0.05);
  backdrop-filter:blur(10px);
  border-radius:15px;
  padding:15px;
  margin-bottom:15px;
  box-shadow:0 8px 25px rgba(0,0,0,0.3);
}

/* GRID NUMEROS */
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(70px,1fr));
  gap:10px;
}

.num{
  padding:12px;
  border-radius:12px;
  text-align:center;
  cursor:pointer;
  font-weight:bold;
  transition:0.3s;
}

.libre{background:#22c55e}
.pendiente{background:#f59e0b}
.pagado{background:#ef4444}
.seleccionado{
  transform:scale(1.1);
  box-shadow:0 0 10px yellow;
}

/* BOTONES */
button{
  width:100%;
  padding:12px;
  border:none;
  border-radius:12px;
  background:linear-gradient(135deg,#22c55e,#16a34a);
  color:white;
  font-weight:bold;
  margin-top:10px;
  cursor:pointer;
  transition:0.3s;
}
button:hover{transform:scale(1.05)}

input{
  width:100%;
  padding:10px;
  border-radius:10px;
  border:none;
  margin-top:5px;
}

/* QR */
.qr{
  text-align:center;
}
.qr img{
  width:180px;
  border-radius:10px;
  background:white;
  padding:10px;
}

/* ADMIN */
.admin{
  display:none;
  position:fixed;
  bottom:0;
  width:100%;
  background:#000;
  max-height:80vh;
  overflow:auto;
}

table{width:100%;font-size:12px}

/* TEXTO */
h2{margin:5px 0}
.total{font-size:16px;font-weight:bold}
</style>
</head>

<body>

<header>🎟️ RIFA SOLIDARIA HOY POR MI MAÑANA POR TI </header>

<div class="container">

<div class="card">
<h2>🎮 PlayStation 5</h2>
<h2>🎮 CPU NUC CORE I7 COMPLETO</h2>
<p>$5 por número</p>
</div>

<div class="card">
<div id="totalBox" class="total">Seleccionados: 0 | Total: $0</div>
<button onclick="comprar()">💳 Comprar ahora</button>

<div id="pagoBox" class="qr" style="display:none;">
<h3>Escanea para pagar</h3>
<img src="qr.png">
</div>
</div>

<div class="card">
<div id="grid" class="grid"></div>
</div>

</div>

<div class="admin" id="admin">
<h3>ADMIN</h3>
<button onclick="exportarExcel()">Excel</button>
<button onclick="reset()">Reset</button>

<table>
<thead><tr><th>#</th><th>Nombre</th><th>Tel</th></tr></thead>
<tbody id="tabla"></tbody>
</table>
</div>

<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

<script>
const firebaseConfig={
apiKey:"AIzaSyBoCNV94pAyGK7bhNE5rVjqOPI40JB4sXQ",
authDomain:"rifa-6dd5b.firebaseapp.com",
databaseURL:"https://rifa-6dd5b-default-rtdb.firebaseio.com",
projectId:"rifa-6dd5b"
};

firebase.initializeApp(firebaseConfig);
const db=firebase.database();

let seleccionados=[];
const precio=5;
const total=500;
const numeroWhatsApp="593XXXXXXXXX";

function cargar(){
let grid=document.getElementById("grid");
for(let i=1;i<=total;i++){
let d=document.createElement("div");
d.className="num libre";
d.innerText=i;
d.onclick=()=>seleccionar(i);
grid.appendChild(d);
}
cargarDatos();
}

function seleccionar(n){
if(seleccionados.includes(n)){
seleccionados=seleccionados.filter(x=>x!==n);
}else{
seleccionados.push(n);
}
actualizarUI();
}

function actualizarUI(){
document.querySelectorAll(".num").forEach(d=>{
let n=parseInt(d.innerText);
d.classList.toggle("seleccionado",seleccionados.includes(n));
});
document.getElementById("totalBox").innerText=
"Seleccionados: "+seleccionados.length+" | Total: $"+(seleccionados.length*precio);
}

function comprar(){
if(seleccionados.length==0)return alert("Selecciona números");

let nombre=prompt("Nombre:");
let tel=prompt("Teléfono:");
if(!nombre||!tel)return;

let totalP=seleccionados.length*precio;

seleccionados.forEach(n=>{
db.ref("rifa/"+n).set({
nombre,tel,estado:"pendiente"
});
});

document.getElementById("pagoBox").style.display="block";

let msg=encodeURIComponent(
"Compra rifa\nNombre:"+nombre+
"\nTel:"+tel+
"\nNums:"+seleccionados.join(",")+
"\nTotal:$"+totalP
);

window.open("https://wa.me/"+numeroWhatsApp+"?text="+msg);

seleccionados=[];
actualizarUI();
}

function cargarDatos(){
db.ref("rifa").on("value",snap=>{
let data=snap.val()||{};
let c=0;

for(let n in data){
c++;
document.querySelectorAll(".num").forEach(d=>{
if(d.innerText==n){
d.className="num "+(data[n].estado=="pagado"?"pagado":"pendiente");
}
});
}

document.getElementById("vendidos").innerText=c;
});
}

function exportarExcel(){
db.ref("rifa").once("value").then(s=>{
let d=s.val(),csv="Num,Nombre,Tel\n";
for(let n in d)csv+=n+","+d[n].nombre+","+d[n].tel+"\n";
let a=document.createElement("a");
a.href=URL.createObjectURL(new Blob([csv]));
a.download="rifa.csv";
a.click();
});
}

function reset(){db.ref("rifa").remove();}

document.addEventListener("keydown",e=>{
if(e.key=="a")document.getElementById("admin").style.display="block";
});

cargar();
</script>

</body>
</html>
