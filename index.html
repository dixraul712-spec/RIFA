<!DOCTYPE html>
<html>
<head>
  <title>Rifa Profesional</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      font-family: Arial;
      background: #0f172a;
      color: white;
      text-align: center;
    }

    h1 { margin: 10px; }

    .box {
      background: #1e293b;
      padding: 10px;
      margin: 10px;
      border-radius: 10px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 10px;
      padding: 20px;
    }

    .num {
      padding: 15px;
      border-radius: 10px;
      font-weight: bold;
      cursor: pointer;
    }

    .libre { background: #22c55e; }
    .pendiente { background: #f59e0b; }
    .pagado { background: #ef4444; }

    input {
      padding: 10px;
      border-radius: 6px;
      border: none;
      width: 150px;
    }

    button {
      padding: 10px;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      font-weight: bold;
      margin: 5px;
    }
  </style>
</head>
<body>

<h1>🎟️ RIFA PROFESIONAL</h1>

<div class="box">
  🥇 PlayStation 5 <br>
  🥈 Computadora Core i7 1TB
</div>

<div class="box">
  💰 Valor: $5 | Vendidos: <span id="vendidos">0</span>
</div>

<div class="box">
  🔍 Buscar número:
  <input type="number" id="buscar">
  <button onclick="buscarNum()">Buscar</button>
  <button onclick="aleatorio()">🎲 Aleatorio</button>
</div>

<div>
  <button onclick="prev()">⬅</button>
  <span id="pagina"></span>
  <button onclick="next()">➡</button>
</div>

<div id="grid" class="grid"></div>

<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyBoCNV94pAyGK7bhNE5rVjqOPI40JB4sXQ",
  authDomain: "rifa-6dd5b.firebaseapp.com",
  databaseURL: "https://rifa-6dd5b-default-rtdb.firebaseio.com",
  projectId: "rifa-6dd5b"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

let paginaActual = 1;
const porPagina = 100;
const total = 2000;

const grid = document.getElementById("grid");

// cargar página
function cargarPagina() {
  grid.innerHTML = "";

  let inicio = (paginaActual - 1) * porPagina + 1;
  let fin = inicio + porPagina - 1;

  document.getElementById("pagina").innerText = "Página " + paginaActual;

  for (let i = inicio; i <= fin; i++) {
    const div = document.createElement("div");
    div.classList.add("num", "libre");
    div.innerText = String(i).padStart(4, '0');

    div.onclick = () => seleccionar(i);

    grid.appendChild(div);
  }

  actualizarEstados();
}

// actualizar estados
function actualizarEstados() {
  db.ref("rifa").once("value", snap => {
    const data = snap.val() || {};
    let count = 0;

    document.querySelectorAll(".num").forEach(div => {
      const n = parseInt(div.innerText);

      if (data[n]) {
        count++;

        if (data[n].estado === "pendiente") {
          div.classList.add("pendiente");
        } else {
          div.classList.add("pagado");
        }
      }
    });

    document.getElementById("vendidos").innerText = count;
  });
}

// buscar número
function buscarNum() {
  const n = document.getElementById("buscar").value;

  if (!n || n < 1 || n > total) {
    alert("Número inválido");
    return;
  }

  paginaActual = Math.ceil(n / porPagina);
  cargarPagina();

  setTimeout(() => {
    document.querySelectorAll(".num").forEach(div => {
      if (parseInt(div.innerText) == n) {
        div.style.border = "3px solid yellow";
      }
    });
  }, 300);
}

// número aleatorio
function aleatorio() {
  const n = Math.floor(Math.random() * total) + 1;
  document.getElementById("buscar").value = n;
  buscarNum();
}

// navegación
function next() {
  if (paginaActual < total / porPagina) {
    paginaActual++;
    cargarPagina();
  }
}

function prev() {
  if (paginaActual > 1) {
    paginaActual--;
    cargarPagina();
  }
}

// seleccionar
function seleccionar(num) {
  const nombre = prompt("Nombre:");
  const telefono = prompt("Teléfono:");

  if (!nombre || !telefono) return;

  db.ref("rifa/" + num).set({
    nombre,
    telefono,
    estado: "pendiente"
  });

  const msg = encodeURIComponent(
    "Hola soy " + nombre +
    ". Reservé el número " + num +
    ". Envío comprobante."
  );

  window.open("https://wa.me/593XXXXXXXXX?text=" + msg);
}

cargarPagina();
</script>

</body>
</html>
