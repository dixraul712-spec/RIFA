<script>
const firebaseConfig = {
  apiKey: "AIzaSyBoCNV94pAyGK7bhNE5rVjqOPI40JB4sXQ",
  authDomain: "rifa-6dd5b.firebaseapp.com",
  databaseURL: "https://rifa-6dd5b-default-rtdb.firebaseio.com",
  projectId: "rifa-6dd5b"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

let paginaActual = 1;
const porPagina = 100;
const total = 2000;

let ultimoNumero = null;

const grid = document.getElementById("grid");

function cargarPagina() {
  grid.innerHTML = "";

  let inicio = (paginaActual - 1) * porPagina + 1;
  let fin = inicio + porPagina - 1;

  document.getElementById("pagina").innerText = "Página " + paginaActual;

  for (let i = inicio; i <= fin; i++) {
    const div = document.createElement("div");
    div.classList.add("num", "libre");
    div.innerText = String(i).padStart(4,'0');
    div.onclick = () => seleccionar(i);
    grid.appendChild(div);
  }

  cargarDatos();
}

function cargarDatos() {
  db.ref("rifa").on("value", snap => {
    const data = snap.val() || {};
    let count = 0;
    const tabla = document.getElementById("tabla");
    tabla.innerHTML = "";

    document.querySelectorAll(".num").forEach(div => {
      const n = parseInt(div.innerText);
      div.className = "num libre";

      if (data[n]) {
        count++;

        if (data[n].estado === "pendiente") {
          div.classList.add("pendiente");
        } else {
          div.classList.add("pagado");
        }

        tabla.innerHTML += `
          <tr>
            <td>${n}</td>
            <td>${data[n].nombre}</td>
            <td>${data[n].telefono}</td>
            <td>${data[n].estado}</td>
            <td>
              <button onclick="pagar(${n})">✔</button>
              <button onclick="eliminar(${n})">❌</button>
            </td>
          </tr>
        `;
      }
    });

    document.getElementById("vendidos").innerText = count;
  });
}

function seleccionar(num) {
  const nombre = prompt("Nombre:");
  const telefono = prompt("Teléfono:");

  if (!nombre || !telefono) return;

  ultimoNumero = num;

  db.ref("rifa/" + num).set({
    nombre,
    telefono,
    estado: "pendiente"
  });

  const msg = encodeURIComponent(
    "Hola soy " + nombre +
    ". Reservé el número " + num +
    ". Envío comprobante."
  );

  window.open("https://wa.me/593987838871?text=" + msg);

  setTimeout(() => {
    if (confirm("¿Ya realizaste el pago?")) {
      yaPague();
    }
  }, 1000);
}

function yaPague() {
  if (!ultimoNumero) return;

  db.ref("rifa/" + ultimoNumero).update({
    estado: "pagado"
  });

  alert("Pago enviado. Espera confirmación.");
}

function pagar(num) {
  db.ref("rifa/" + num).update({ estado: "pagado" });
}

function eliminar(num) {
  db.ref("rifa/" + num).remove();
}

function reset() {
  db.ref("rifa").remove();
}

function buscarNum() {
  const n = document.getElementById("buscar").value;
  paginaActual = Math.ceil(n / porPagina);
  cargarPagina();
}

function aleatorio() {
  const n = Math.floor(Math.random() * total) + 1;
  document.getElementById("buscar").value = n;
  buscarNum();
}

function next() {
  if (paginaActual < total / porPagina) {
    paginaActual++;
    cargarPagina();
  }
}

function prev() {
  if (paginaActual > 1) {
    paginaActual--;
    cargarPagina();
  }
}

document.addEventListener("keydown", e => {
  if (e.key === "a") {
    document.getElementById("admin").style.display = "block";
  }
});

cargarPagina();
</script>

</body>
</html>
