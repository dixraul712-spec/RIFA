<!DOCTYPE html>
<html lang="es">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rifa Premium</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

<style>
body{
  font-family:'Poppins',sans-serif;
  background:linear-gradient(135deg,#0f172a,#1e293b);
  color:white;
  margin:0;
}

header{
  background:#22c55e;
  padding:15px;
  text-align:center;
  font-weight:700;
}

.container{padding:15px;max-width:1100px;margin:auto}

.card{
  background:rgba(255,255,255,0.05);
  border-radius:15px;
  padding:15px;
  margin-bottom:15px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(70px,1fr));
  gap:10px;
}

.num{
  padding:12px;
  border-radius:12px;
  text-align:center;
  cursor:pointer;
  font-weight:bold;
}

.libre{background:#22c55e}
.pendiente{background:#f59e0b; cursor:not-allowed}
.pagado{background:#ef4444; cursor:not-allowed}

.seleccionado{
  transform:scale(1.1);
  box-shadow:0 0 10px yellow;
}

button{
  padding:8px;
  border:none;
  border-radius:8px;
  background:#22c55e;
  color:white;
  cursor:pointer;
}

.qr{
  display:flex;
  gap:20px;
  flex-wrap:wrap;
  margin-top:10px;
}

.qr img{
  width:180px;
  background:white;
  padding:10px;
  border-radius:10px;
}
</style>
</head>

<body>

<header>🎟️ RIFA PREMIUM</header>

<!-- 🔐 BOTÓN ADMIN OCULTO -->
<button onclick="abrirAdmin()" style="position:fixed;top:10px;right:10px;">🔐</button>

<div class="container">

<div class="card">
<h2>🎮 PlayStation 5</h2>
<h2>💻 CPU NUC COMPLETA</h2>
<p>$5 por número</p>
<p>Vendidos: <b id="vendidos">0</b></p>
</div>

<div class="card">
<div id="totalBox">Seleccionados: 0 | Total: $0</div>
<button onclick="comprar()">💳 Comprar</button>

<div id="pagoBox" class="qr" style="display:none;">
<img src="qr.png">

<div>
<b>DATOS</b><br>
LUIS ALVEAR<br>
CUENTA PICHINCHA<br>
2204309484<br>
0987838871<br><br>
<b>ENVÍA COMPROBANTE</b>
</div>
</div>
</div>

<div class="card">
<div id="grid" class="grid"></div>
</div>

<!-- 🔒 PANEL ADMIN -->
<div class="card" id="adminPanel" style="display:none;">
<h3>📊 REGISTROS</h3>

<input id="buscador" onkeyup="filtrar()" placeholder="Buscar..." style="width:100%;padding:10px;margin-bottom:10px;">

<table width="100%">
<thead>
<tr>
<th>#</th><th>Nombre</th><th>Cédula</th><th>Tel</th><th>Estado</th><th>Acción</th>
</tr>
</thead>
<tbody id="tabla"></tbody>
</table>

<button onclick="exportarExcel()">📤 Exportar Excel</button>
</div>

</div>

<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

<script>
const firebaseConfig={
apiKey:"AIzaSyBoCNV94pAyGK7bhNE5rVjqOPI40JB4sXQ",
authDomain:"rifa-6dd5b.firebaseapp.com",
databaseURL:"https://rifa-6dd5b-default-rtdb.firebaseio.com",
projectId:"rifa-6dd5b"
};

firebase.initializeApp(firebaseConfig);
const db=firebase.database();

let seleccionados=[];
const precio=5;
const total=500;
const numeroWhatsApp="593987838871";

function abrirAdmin(){
let clave=prompt("Clave admin:");
if(clave==="Rifa2026$Pro"){
document.getElementById("adminPanel").style.display="block";
}else{
alert("Acceso denegado");
}
}

function cargar(){
let grid=document.getElementById("grid");
for(let i=1;i<=total;i++){
let d=document.createElement("div");
d.className="num libre";
d.innerText=i;
d.onclick=()=>seleccionar(i);
grid.appendChild(d);
}
cargarDatos();
}

function seleccionar(n){
let e=document.querySelectorAll(".num")[n-1];

if(e.classList.contains("pendiente")||e.classList.contains("pagado")){
alert("No disponible");
return;
}

if(seleccionados.includes(n)){
seleccionados=seleccionados.filter(x=>x!==n);
}else{
seleccionados.push(n);
}

actualizarUI();
}

function actualizarUI(){
document.querySelectorAll(".num").forEach(d=>{
let n=parseInt(d.innerText);
d.classList.toggle("seleccionado",seleccionados.includes(n));
});

document.getElementById("totalBox").innerText=
"Seleccionados: "+seleccionados.length+" | Total: $"+(seleccionados.length*precio);
}

function comprar(){
if(seleccionados.length==0)return alert("Selecciona");

let nombre=prompt("Nombre");
let cedula=prompt("Cédula");
let tel=prompt("Teléfono");

if(!nombre||!cedula||!tel)return;

let totalP=seleccionados.length*precio;

seleccionados.forEach(n=>{
db.ref("rifa/"+n).set({
nombre,cedula,tel,estado:"pendiente"
});
});

document.getElementById("pagoBox").style.display="flex";

let msg=encodeURIComponent(
"Compra rifa\n"+nombre+"\n"+cedula+"\n"+tel+"\nNums:"+seleccionados.join(",")+"\n$"+totalP
);

window.open("https://wa.me/"+numeroWhatsApp+"?text="+msg);

seleccionados=[];
actualizarUI();
}

function cargarDatos(){
db.ref("rifa").on("value",snap=>{
let data=snap.val()||{};
let html="";
let c=0;

for(let n in data){
c++;
let d=data[n];

document.querySelectorAll(".num").forEach(x=>{
if(x.innerText==n){
x.className="num "+(d.estado=="pagado"?"pagado":"pendiente");
}
});

html+=`
<tr>
<td>${n}</td>
<td>${d.nombre}</td>
<td>${d.cedula}</td>
<td>${d.tel}</td>
<td>${d.estado}</td>
<td><button onclick="marcarPagado(${n})">✅</button></td>
</tr>`;
}

document.getElementById("tabla").innerHTML=html;
document.getElementById("vendidos").innerText=c;
});
}

function marcarPagado(n){
if(confirm("Pagado?")){
db.ref("rifa/"+n).update({estado:"pagado"});
}
}

function exportarExcel(){
db.ref("rifa").once("value").then(snap=>{
let data=snap.val()||{};
let csv="Numero,Nombre,Cedula,Telefono,Estado\n";

for(let n in data){
let d=data[n];
csv+=`${n},${d.nombre},${d.cedula},${d.tel},${d.estado}\n`;
}

let blob=new Blob([csv]);
let a=document.createElement("a");
a.href=URL.createObjectURL(blob);
a.download="rifa.csv";
a.click();
});
}

function filtrar(){
let v=document.getElementById("buscador").value.toLowerCase();
document.querySelectorAll("#tabla tr").forEach(tr=>{
tr.style.display=tr.innerText.toLowerCase().includes(v)?"":"none";
});
}

cargar();
</script>

</body>
</html>
