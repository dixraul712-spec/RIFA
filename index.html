<!DOCTYPE html>
<html lang="es">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RIFA SOLIDARIA</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

<style>
body{
  font-family:'Poppins',sans-serif;
  background:linear-gradient(135deg,#0f172a,#1e293b);
  color:white;
  margin:0;
}

header{
  background:#22c55e;
  padding:15px;
  text-align:center;
  font-weight:700;
}

.container{padding:15px;max-width:1100px;margin:auto}

.card{
  background:rgba(255,255,255,0.05);
  border-radius:15px;
  padding:15px;
  margin-bottom:15px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(60px,1fr));
  gap:8px;
}

.num{
  padding:10px;
  border-radius:10px;
  text-align:center;
  cursor:pointer;
  font-weight:bold;
}

.libre{background:#22c55e}
.pendiente{background:#f59e0b}
.pagado{background:#ef4444}

.seleccionado{
  outline:3px solid yellow;
}

button{
  width:100%;
  padding:12px;
  border:none;
  border-radius:10px;
  background:#22c55e;
  color:white;
  font-weight:bold;
  margin-top:10px;
  cursor:pointer;
}

input{
  width:100%;
  padding:10px;
  border-radius:10px;
  border:none;
  margin-top:5px;
}

.qr{
  display:flex;
  gap:15px;
  align-items:center;
  justify-content:center;
  flex-wrap:wrap;
}

.qr img{
  width:180px;
  background:white;
  padding:10px;
  border-radius:10px;
}

.admin{
  display:none;
  position:fixed;
  bottom:0;
  width:100%;
  background:#000;
  max-height:80vh;
  overflow:auto;
}

table{width:100%;font-size:12px}
</style>
</head>

<body>

<header>🎟️ RIFA SOLIDARIA</header>

<div class="container">

<div class="card" style="text-align:center">

<h3>🎁 PREMIOS</h3>

<img src="ps5.png" style="width:100%;max-width:400px;margin-bottom:15px;border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,0.5);">

<img src="cpunuc.png" style="width:100%;max-width:500px;border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,0.5);">

<p>$5 por número</p>

</div>

<div class="card">
<input type="text" placeholder="🔍 Buscar número..." oninput="buscar(this.value)">
<div id="totalBox">Seleccionados: 0 | Total: $0</div>
<button onclick="comprar()">💳 COMPRAR</button>
</div>

<div class="card qr" id="pagoBox" style="display:none;">
<img src="qr.png">
<div>
<h4>DATOS</h4>
<p>LUIS ALVEAR</p>
<p>CUENTA DE AHORROS PICHINCHA</p>
<p>2204309484</p>
<p>0987838871</p>
<p>📲 Enviar comprobante por WhatsApp</p>
</div>
</div>

<div class="card">
<div id="grid" class="grid"></div>
</div>

</div>

<div class="admin" id="admin">
<h3>PANEL ADMIN</h3>
<button onclick="exportarExcel()">Exportar Excel</button>
<button onclick="reset()">Reset</button>

<table>
<thead><tr><th>#</th><th>Nombre</th><th>Tel</th><th>Cédula</th><th>Estado</th></tr></thead>
<tbody id="tabla"></tbody>
</table>
</div>

<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

<script>
const firebaseConfig={
apiKey:"TU_API_KEY",
authDomain:"TU_DOMINIO",
databaseURL:"TU_DB_URL",
projectId:"TU_ID"
};

firebase.initializeApp(firebaseConfig);
const db=firebase.database();

let seleccionados=[];
const precio=5;
const total=2000;
const numeroWhatsApp="593987838871";

function cargar(){
let grid=document.getElementById("grid");
for(let i=1;i<=total;i++){
let d=document.createElement("div");
d.className="num libre";
d.innerText=i;
d.onclick=()=>seleccionar(i,d);
grid.appendChild(d);
}
cargarDatos();
}

function seleccionar(n,el){
if(el.classList.contains("pagado") || el.classList.contains("pendiente")) return;

if(seleccionados.includes(n)){
seleccionados=seleccionados.filter(x=>x!==n);
}else{
seleccionados.push(n);
}
actualizarUI();
}

function actualizarUI(){
document.querySelectorAll(".num").forEach(d=>{
let n=parseInt(d.innerText);
d.classList.toggle("seleccionado",seleccionados.includes(n));
});
document.getElementById("totalBox").innerText=
"Seleccionados: "+seleccionados.length+" | Total: $"+(seleccionados.length*precio);
}

function comprar(){
if(seleccionados.length==0)return alert("Selecciona números");

let nombre=prompt("Nombre:");
let tel=prompt("Teléfono:");
let cedula=prompt("Cédula:");

let totalP=seleccionados.length*precio;

seleccionados.forEach(n=>{
db.ref("rifa/"+n).set({
nombre,tel,cedula,estado:"pendiente"
});
});

document.getElementById("pagoBox").style.display="flex";

let msg=encodeURIComponent(
"RIFA SOLIDARIA\n\nNombre:"+nombre+
"\nTel:"+tel+
"\nCedula:"+cedula+
"\nNumeros:"+seleccionados.join(",")+
"\nTotal:$"+totalP
);

window.open("https://wa.me/"+numeroWhatsApp+"?text="+msg);

seleccionados=[];
actualizarUI();
}

function cargarDatos(){
db.ref("rifa").on("value",snap=>{
let data=snap.val()||{};
document.querySelectorAll(".num").forEach(d=>{
let n=d.innerText;
if(data[n]){
d.className="num "+(data[n].estado=="pagado"?"pagado":"pendiente");
}
});
});
}

function buscar(valor){
document.querySelectorAll(".num").forEach(d=>{
d.style.display=d.innerText.includes(valor)?'block':'none';
});
}

function exportarExcel(){
db.ref("rifa").once("value").then(s=>{
let d=s.val(),csv="Num,Nombre,Tel,Cedula,Estado\n";
for(let n in d)csv+=n+","+d[n].nombre+","+d[n].tel+","+d[n].cedula+","+d[n].estado+"\n";
let a=document.createElement("a");
a.href=URL.createObjectURL(new Blob([csv]));
a.download="rifa.csv";
a.click();
});
}

function reset(){db.ref("rifa").remove();}

document.addEventListener("keydown",e=>{
if(e.key=="a"){
let c=prompt("Clave:");
if(c==="Rifa2026$Pro"){
document.getElementById("admin").style.display="block";
}
}
});

cargar();
</script>

</body>
</html>
