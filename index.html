<!DOCTYPE html>
<html>
<head>
  <title>Rifa Profesional</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      font-family: Arial;
      background: #0f172a;
      color: white;
      text-align: center;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(10, 1fr);
      gap: 8px;
      padding: 20px;
    }

    .num {
      padding: 12px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
    }

    .libre { background: #22c55e; }
    .ocupado { background: #ef4444; cursor: not-allowed; }

    .box {
      background: #1e293b;
      padding: 15px;
      margin: 10px;
      border-radius: 10px;
    }

    input {
      padding: 8px;
      margin: 5px;
      border-radius: 5px;
      border: none;
    }

    button {
      padding: 10px;
      border: none;
      border-radius: 6px;
      background: #22c55e;
      cursor: pointer;
      font-weight: bold;
    }

    .admin {
      display: none;
      background: black;
      padding: 10px;
      position: fixed;
      bottom: 10px;
      right: 10px;
    }
  </style>
</head>
<body>

<h1>🎟️ RIFA PROFESIONAL</h1>

<div class="box">
  Vendidos: <span id="vendidos">0</span>
</div>

<div id="grid" class="grid"></div>

<div class="box">
  <h3>📌 Instrucciones de Pago</h3>
  <p>Transferir a:</p>
  <p><b>Banco Pichincha</b></p>
  <p>Cuenta: 1234567890</p>
  <p>Nombre: TU NOMBRE</p>
  <p>Luego envía comprobante por WhatsApp</p>
</div>

<div class="admin" id="admin">
  <button onclick="verClientes()">📋 Ver Clientes</button>
  <button onclick="reset()">🔄 Reset</button>
</div>

<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyBoCNV94pAyGK7bhNE5rVjqOPI40JB4sXQ",
  authDomain: "rifa-6dd5b.firebaseapp.com",
  databaseURL: "https://rifa-6dd5b-default-rtdb.firebaseio.com",
  projectId: "rifa-6dd5b",
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

const grid = document.getElementById("grid");

// crear números
for (let i = 1; i < 2000; i++) {
  const div = document.createElement("div");
  div.classList.add("num", "libre");
  div.innerText = i;

  div.onclick = () => seleccionar(i);

  grid.appendChild(div);
}

// escuchar cambios
db.ref("rifa").on("value", snap => {
  const data = snap.val() || {};
  let count = 0;

  document.querySelectorAll(".num").forEach(div => {
    const n = div.innerText;

    if (data[n]) {
      div.classList.remove("libre");
      div.classList.add("ocupado");
      count++;
    }
  });

  document.getElementById("vendidos").innerText = count;
});

// seleccionar número
function seleccionar(num) {
  const nombre = prompt("Ingresa tu nombre:");
  const telefono = prompt("Ingresa tu teléfono:");

  if (!nombre || !telefono) return;

  db.ref("rifa/" + num).set({
    nombre,
    telefono,
    estado: "pendiente"
  });

  const msg = encodeURIComponent(
    "Hola, soy " + nombre +
    ". Reservé el número " + num +
    ". Envío comprobante."
  );

  window.open("https://wa.me/593XXXXXXXXX?text=" + msg);
}

// admin secreto
document.addEventListener("keydown", e => {
  if (e.key === "a") {
    document.getElementById("admin").style.display = "block";
  }
});

// ver clientes
function verClientes() {
  db.ref("rifa").once("value", snap => {
    console.log(snap.val());
    alert("Revisa la consola (F12)");
  });
}

// reset
function reset() {
  if (confirm("Borrar todo?")) {
    db.ref("rifa").remove();
  }
}
</script>

</body>
</html>
