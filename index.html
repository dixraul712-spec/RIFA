```html
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rifa Premium</title>

<style>
body{
font-family:Arial;
background:#0f172a;
color:white;
text-align:center;
margin:0;
}

.container{
padding:20px;
}

h1{
margin-bottom:10px;
}

.premios{
background:linear-gradient(135deg,#22c55e,#16a34a);
padding:15px;
border-radius:12px;
color:black;
font-weight:bold;
margin-bottom:20px;
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fill,minmax(60px,1fr));
gap:8px;
}

.num{
padding:10px;
background:#1e293b;
border-radius:8px;
cursor:pointer;
}

.selected{
background:#22c55e;
color:black;
}

button{
margin-top:15px;
padding:12px;
border:none;
border-radius:10px;
background:#22c55e;
font-weight:bold;
cursor:pointer;
}

.qr{
margin-top:20px;
display:none;
}

</style>
</head>

<body>

<div class="container">

<h1>🎟 Rifa Premium</h1>

<div class="premios">
🎁 PREMIOS OFICIALES<br><br>
🥇 PlayStation 5 🎮<br>
🥈 CPU NUC completa 💻<br>
🥉 $200 en efectivo 💵
</div>

<p>Selecciona tus números:</p>

<div class="grid" id="grid"></div>

<p id="total"></p>

<button onclick="pagar()">💰 PAGAR</button>

<div class="qr" id="qr">
<p>Escanea y paga:</p>
<img src="qr.png" width="200">
<br><br>
<button onclick="yaPague()">✅ YA PAGUÉ</button>
</div>

</div>

<script>
let seleccionados = []
let precio = 1

let grid = document.getElementById("grid")

for(let i=1;i<=10000;i++){
let div = document.createElement("div")
div.className="num"
div.innerText=i

div.onclick=()=>{
if(seleccionados.includes(i)){
seleccionados = seleccionados.filter(n=>n!==i)
div.classList.remove("selected")
}else{
seleccionados.push(i)
div.classList.add("selected")
}
actualizarTotal()
}

grid.appendChild(div)
}

function actualizarTotal(){
document.getElementById("total").innerText =
"Total: $" + (seleccionados.length * precio)
}

function pagar(){
if(seleccionados.length==0){
alert("Selecciona al menos un número")
return
}
document.getElementById("qr").style.display="block"
}

function yaPague(){
let numeros = seleccionados.join(", ")

let link = "https://wa.me/593TU_NUMERO?text=Hola%20ya%20pagué%20los%20números:%20"+numeros

window.open(link,"_blank")
}
</script>

</body>
</html>
