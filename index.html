```html id="responsivepro1"
<!DOCTYPE html>
<html>
<head>
  <title>Rifa Profesional</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      font-family: 'Segoe UI', Arial;
      background: #0f172a;
      color: white;
      margin: 0;
    }

    header {
      padding: 15px;
      text-align: center;
      background: #020617;
      font-size: 20px;
      font-weight: bold;
    }

    .container {
      max-width: 1000px;
      margin: auto;
      padding: 10px;
    }

    .card {
      background: #1e293b;
      padding: 15px;
      margin: 10px 0;
      border-radius: 12px;
      box-shadow: 0 0 10px rgba(0,0,0,0.3);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(70px, 1fr));
      gap: 10px;
    }

    .num {
      padding: 15px;
      border-radius: 10px;
      font-weight: bold;
      text-align: center;
      cursor: pointer;
      font-size: 14px;
    }

    .libre { background: #22c55e; }
    .pendiente { background: #f59e0b; }
    .pagado { background: #ef4444; }

    input {
      padding: 10px;
      border-radius: 8px;
      border: none;
      width: 100%;
      margin-top: 5px;
      font-size: 16px;
    }

    .row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    button {
      flex: 1;
      padding: 12px;
      border-radius: 8px;
      border: none;
      font-weight: bold;
      cursor: pointer;
      background: #22c55e;
      color: black;
      font-size: 14px;
    }

    .nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .nav button {
      flex: unset;
      width: 100px;
    }

    @media (max-width: 600px) {
      .num {
        padding: 12px;
        font-size: 12px;
      }

      button {
        font-size: 13px;
        padding: 10px;
      }
    }
  </style>
</head>
<body>

<header>🎟️ RIFA PROFESIONAL</header>

<div class="container">

  <div class="card">
    🥇 PlayStation 5 <br>
    🥈 Computadora Core i7 1TB
  </div>

  <div class="card">
    💰 $5 por número  
    <br>
    Vendidos: <span id="vendidos">0</span>
  </div>

  <div class="card">
    🔍 Buscar número
    <input type="number" id="buscar" placeholder="Ej: 25">

    <div class="row">
      <button onclick="buscarNum()">Buscar</button>
      <button onclick="aleatorio()">🎲 Aleatorio</button>
    </div>
  </div>

  <div class="card nav">
    <button onclick="prev()">⬅</button>
    <span id="pagina"></span>
    <button onclick="next()">➡</button>
  </div>

  <div id="grid" class="grid"></div>

</div>

<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyBoCNV94pAyGK7bhNE5rVjqOPI40JB4sXQ",
  authDomain: "rifa-6dd5b.firebaseapp.com",
  databaseURL: "https://rifa-6dd5b-default-rtdb.firebaseio.com",
  projectId: "rifa-6dd5b"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

let paginaActual = 1;
const porPagina = 100;
const total = 2000;

const grid = document.getElementById("grid");

// cargar
function cargarPagina() {
  grid.innerHTML = "";

  let inicio = (paginaActual - 1) * porPagina + 1;
  let fin = inicio + porPagina - 1;

  document.getElementById("pagina").innerText =
    "Página " + paginaActual;

  for (let i = inicio; i <= fin; i++) {
    const div = document.createElement("div");
    div.classList.add("num", "libre");
    div.innerText = String(i).padStart(4, '0');

    div.onclick = () => seleccionar(i);

    grid.appendChild(div);
  }

  actualizarEstados();
}

// estados
function actualizarEstados() {
  db.ref("rifa").once("value", snap => {
    const data = snap.val() || {};
    let count = 0;

    document.querySelectorAll(".num").forEach(div => {
      const n = parseInt(div.innerText);

      if (data[n]) {
        count++;

        if (data[n].estado === "pendiente") {
          div.classList.add("pendiente");
        } else {
          div.classList.add("pagado");
        }
      }
    });

    document.getElementById("vendidos").innerText = count;
  });
}

// buscar
function buscarNum() {
  const n = document.getElementById("buscar").value;

  if (!n || n < 1 || n > total) {
    alert("Número inválido");
    return;
  }

  paginaActual = Math.ceil(n / porPagina);
  cargarPagina();

  setTimeout(() => {
    document.querySelectorAll(".num").forEach(div => {
      if (parseInt(div.innerText) == n) {
        div.style.border = "3px solid yellow";
      }
    });
  }, 300);
}

// aleatorio
function aleatorio() {
  const n = Math.floor(Math.random() * total) + 1;
  document.getElementById("buscar").value = n;
  buscarNum();
}

// nav
function next() {
  if (paginaActual < total / porPagina) {
    paginaActual++;
    cargarPagina();
  }
}

function prev() {
  if (paginaActual > 1) {
    paginaActual--;
    cargarPagina();
  }
}

// comprar
function seleccionar(num) {
  const nombre = prompt("Nombre:");
  const telefono = prompt("Teléfono:");

  if (!nombre || !telefono) return;

  db.ref("rifa/" + num).set({
    nombre,
    telefono,
    estado: "pendiente"
  });

  const msg = encodeURIComponent(
    "Hola soy " + nombre +
    ". Reservé el número " + num +
    ". Envío comprobante."
  );

  window.open("https://wa.me/593XXXXXXXXX?text=" + msg);
}

cargarPagina();
</script>

</body>
</html>
