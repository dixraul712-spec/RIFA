<!DOCTYPE html>
<html>
<head>
  <title>Rifa PRO</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body { font-family: Arial; background:#0f172a; color:white; margin:0; }
    header { background:#22c55e; color:black; text-align:center; padding:15px; font-size:20px; }

    .container { max-width:1000px; margin:auto; padding:10px; }

    .card { background:#1e293b; padding:15px; border-radius:10px; margin-bottom:10px; }

    .mensaje {
      background:#22c55e; color:black; padding:10px;
      border-radius:8px; text-align:center; font-weight:bold;
    }

    .flex { display:flex; justify-content:space-between; flex-wrap:wrap; }

    .qr img { width:180px; background:white; padding:10px; border-radius:10px; }

    .grid {
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(70px,1fr));
      gap:8px;
    }

    .num { padding:10px; border-radius:8px; text-align:center; cursor:pointer; }
    .libre{ background:#22c55e; }
    .pendiente{ background:#f59e0b; }
    .pagado{ background:#ef4444; }

    input,button {
      padding:10px; border:none; border-radius:8px; margin-top:5px;
    }

    button { background:#22c55e; font-weight:bold; }

    .admin {
      display:none;
      position:fixed;
      bottom:0;
      width:100%;
      background:black;
      max-height:80vh;
      overflow:auto;
    }

    table { width:100%; font-size:12px; border-collapse:collapse; }
    td,th { border:1px solid gray; padding:5px; text-align:center; }

  </style>
</head>

<body>

<header>🎟️ RIFA PRO</header>

<div class="container">

<div class="card">
🥇 PlayStation 5 <br>
🥈 Computadora Core i7 <br>
💰 $5 por número <br><br>

Vendidos: <b id="vendidos">0</b>

<div class="mensaje">
💬 Pagos seguros + envío de comprobante  
✔ Confirmación inmediata
</div>
</div>

<div class="card flex">
<div>
<h3>💳 Pago QR</h3>
<input type="file" id="comprobante">
<button onclick="enviarComprobante()">📤 Enviar comprobante</button>
</div>

<div class="qr">
<img src="qr.png">
</div>
</div>

<div class="card">
<input type="number" id="buscar" placeholder="Buscar número">
<button onclick="buscarNum()">Buscar</button>
<button onclick="aleatorio()">🎲</button>
</div>

<div class="card">
<button onclick="prev()">⬅</button>
<span id="pagina"></span>
<button onclick="next()">➡</button>
</div>

<div id="grid" class="grid"></div>

</div>

<div class="admin" id="admin">
<h3>ADMIN</h3>
<button onclick="exportarExcel()">Excel</button>
<button onclick="reset()">Reset</button>

<table>
<thead>
<tr>
<th>#</th><th>Nombre</th><th>Teléfono</th><th>Estado</th><th>Comp</th><th></th>
</tr>
</thead>
<tbody id="tabla"></tbody>
</table>
</div>

<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyBoCNV94pAyGK7bhNE5rVjqOPI40JB4sXQ",
  authDomain: "rifa-6dd5b.firebaseapp.com",
  databaseURL: "https://rifa-6dd5b-default-rtdb.firebaseio.com",
  projectId: "rifa-6dd5b"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

let paginaActual=1;
const porPagina=100;
const total=2000;
let ultimoNumero=null;

const numeroWhatsApp="593XXXXXXXXX"; // CAMBIAR

function cargarPagina(){
let grid=document.getElementById("grid");
grid.innerHTML="";

let inicio=(paginaActual-1)*porPagina+1;
let fin=inicio+porPagina-1;

document.getElementById("pagina").innerText="Página "+paginaActual;

for(let i=inicio;i<=fin;i++){
let div=document.createElement("div");
div.className="num libre";
div.innerText=i;
div.onclick=()=>seleccionar(i);
grid.appendChild(div);
}

cargarDatos();
}

function cargarDatos(){
db.ref("rifa").on("value",snap=>{
let data=snap.val()||{};
let count=0;
let tabla=document.getElementById("tabla");
tabla.innerHTML="";

for(let n in data){
let d=data[n];
count++;

tabla.innerHTML+=`
<tr>
<td>${n}</td>
<td>${d.nombre}</td>
<td>${d.telefono}</td>
<td>${d.estado}</td>
<td>${d.comprobante?'<a href="'+d.comprobante+'" target="_blank">Ver</a>':''}</td>
<td><button onclick="pagar(${n})">✔</button></td>
</tr>`;
}

document.querySelectorAll(".num").forEach(div=>{
let n=parseInt(div.innerText);
div.className="num libre";

if(data[n]){
if(data[n].estado==="pendiente"||data[n].estado==="verificando")
div.classList.add("pendiente");
else div.classList.add("pagado");
}
});

document.getElementById("vendidos").innerText=count;
});
}

function seleccionar(num){
let nombre=prompt("Nombre:");
let telefono=prompt("Teléfono:");
if(!nombre||!telefono)return;

ultimoNumero=num;

db.ref("rifa/"+num).set({
nombre,telefono,estado:"pendiente"
});

// WHATSAPP AUTOMÁTICO
let msg=encodeURIComponent(
"Hola 👋\nNombre: "+nombre+
"\nTeléfono: "+telefono+
"\nNúmero: "+num+
"\nYa realicé el pago, envío comprobante."
);

window.open("https://wa.me/"+0987838871+"?text="+msg);
}

function enviarComprobante(){
let file=document.getElementById("comprobante").files[0];
if(!file||!ultimoNumero){alert("Falta comprobante");return;}

let reader=new FileReader();
reader.onload=e=>{
db.ref("rifa/"+ultimoNumero).update({
estado:"verificando",
comprobante:e.target.result
});
alert("Enviado ✔");
};
reader.readAsDataURL(file);
}

function pagar(n){ db.ref("rifa/"+n).update({estado:"pagado"}); }

function exportarExcel(){
db.ref("rifa").once("value").then(snap=>{
let data=snap.val();
let csv="Numero,Nombre,Telefono,Estado\n";
for(let n in data){
let d=data[n];
csv+=`${n},${d.nombre},${d.telefono},${d.estado}\n`;
}
let blob=new Blob([csv]);
let a=document.createElement("a");
a.href=URL.createObjectURL(blob);
a.download="rifa.csv";
a.click();
});
}

function reset(){ db.ref("rifa").remove(); }

function buscarNum(){
let n=document.getElementById("buscar").value;
paginaActual=Math.ceil(n/porPagina);
cargarPagina();
}

function aleatorio(){
let n=Math.floor(Math.random()*total)+1;
document.getElementById("buscar").value=n;
buscarNum();
}

function next(){ if(paginaActual<total/porPagina){paginaActual++;cargarPagina();}}
function prev(){ if(paginaActual>1){paginaActual--;cargarPagina();}}

document.addEventListener("keydown",e=>{
if(e.key==="a") document.getElementById("admin").style.display="block";
});

cargarPagina();
</script>

</body>
</html>
