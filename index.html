<!DOCTYPE html>
<html>
<head>
  <title>Rifa Pro</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      font-family: Arial;
      text-align: center;
      background: #0f172a;
      color: white;
      margin: 0;
    }

    h1 {
      margin-top: 20px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(10, 1fr);
      gap: 8px;
      padding: 20px;
    }

    .num {
      padding: 15px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
      transition: 0.2s;
    }

    .num:hover {
      transform: scale(1.05);
    }

    .libre {
      background: #22c55e;
    }

    .ocupado {
      background: #ef4444;
      cursor: not-allowed;
    }
  </style>
</head>
<body>

<h1>🎟️ RIFA PRO</h1>
<p>Selecciona tu número</p>

<div class="grid" id="grid"></div>

<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyBoCNV94pAyGK7bhNE5rVjqOPI40JB4sXQ",
  authDomain: "rifa-6dd5b.firebaseapp.com",
  databaseURL: "https://rifa-6dd5b-default-rtdb.firebaseio.com",
  projectId: "rifa-6dd5b",
  storageBucket: "rifa-6dd5b.firebasestorage.app",
  messagingSenderId: "294439891580",
  appId: "1:294439891580:web:b7d502f1be0631033b8ff9"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

const grid = document.getElementById("grid");

// Crear números
for (let i = 0; i < 100; i++) {
  const div = document.createElement("div");
  div.classList.add("num", "libre");
  div.innerText = i;

  div.onclick = () => comprar(i);

  grid.appendChild(div);
}

// Escuchar Firebase
db.ref("rifa").on("value", snapshot => {
  const data = snapshot.val() || {};

  document.querySelectorAll(".num").forEach(div => {
    const num = div.innerText;

    if (data[num]) {
      div.classList.remove("libre");
      div.classList.add("ocupado");
    }
  });
});

// Comprar
function comprar(numero) {
  if (confirm("¿Comprar número " + numero + "?")) {

    db.ref("rifa/" + numero).set({
      comprado: true
    });

    window.open("https://wa.me/593987838871"); // CAMBIA TU NUMERO
  }
}
</script>

</body>
</html>
