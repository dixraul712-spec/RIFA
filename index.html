<!DOCTYPE html>
<html lang="es">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rifa Premium</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

<style>
body{
  font-family:'Poppins',sans-serif;
  background:linear-gradient(135deg,#0f172a,#1e293b);
  color:white;
  margin:0;
}

header{
  background:#22c55e;
  padding:15px;
  text-align:center;
  font-weight:700;
}

.container{padding:15px;max-width:1100px;margin:auto}

.card{
  background:rgba(255,255,255,0.05);
  border-radius:15px;
  padding:15px;
  margin-bottom:15px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(60px,1fr));
  gap:8px;
  max-height:400px;
  overflow:auto;
}

.num{
  padding:10px;
  border-radius:10px;
  text-align:center;
  cursor:pointer;
  font-weight:bold;
  font-size:12px;
}

.libre{background:#22c55e}
.pendiente{background:#f59e0b}
.pagado{background:#ef4444}

.seleccionado{
  transform:scale(1.1);
  box-shadow:0 0 8px yellow;
}

button{
  padding:10px;
  border:none;
  border-radius:10px;
  background:#22c55e;
  color:white;
  cursor:pointer;
  width:100%;
  margin-top:10px;
}

input{
  border-radius:10px;
  border:none;
}

.qr{
  display:flex;
  gap:20px;
  flex-wrap:wrap;
  margin-top:15px;
}
.qr img{
  width:200px;
  background:white;
  padding:10px;
  border-radius:10px;
}
</style>
</head>

<body>

<header>🎟️ RIFA PREMIUM</header>
<button onclick="abrirAdmin()" style="position:fixed;top:10px;right:10px;">🔐</button>

<div class="container">

<div class="card">
<h2>🎮 PlayStation 5</h2>
<h2>💻 CPU NUC COMPLETA</h2>
<p>$5 por número</p>
<p>Vendidos: <b id="vendidos">0</b></p>
</div>

<div class="card">
<div id="totalBox">Seleccionados: 0 | Total: $0</div>
<button onclick="comprar()">💳 Comprar</button>

<div id="pagoBox" class="qr" style="display:none;">
<img src="qr.png">
<div>
<h3>💳 PAGO</h3>
<p>Total: $<span id="totalPago">0</span></p>
<b>LUIS ALVEAR</b><br>
Pichincha<br>
2204309484<br>
0987838871
</div>
</div>
</div>

<div class="card">
<input id="buscadorNumeros" placeholder="🔍 Buscar número..." onkeyup="buscarNumero()" style="width:100%;padding:10px;margin-bottom:10px;">
<div id="grid" class="grid"></div>
</div>

<div class="card" id="adminPanel" style="display:none;">
<h3>📊 REGISTROS</h3>
<input id="buscador" onkeyup="filtrar()" placeholder="Buscar cliente..." style="width:100%;padding:10px;margin-bottom:10px;">
<table width="100%">
<thead>
<tr><th>#</th><th>Nombre</th><th>Cédula</th><th>Tel</th><th>Estado</th><th></th></tr>
</thead>
<tbody id="tabla"></tbody>
</table>
<button onclick="exportarExcel()">📤 Exportar Excel</button>
</div>

</div>

<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

<script>
const firebaseConfig={
apiKey:"AIzaSyBoCNV94pAyGK7bhNE5rVjqOPI40JB4sXQ",
authDomain:"rifa-6dd5b.firebaseapp.com",
databaseURL:"https://rifa-6dd5b-default-rtdb.firebaseio.com",
projectId:"rifa-6dd5b"
};

firebase.initializeApp(firebaseConfig);
const db=firebase.database();

let seleccionados=[];
const precio=5;
const total=2000;

function abrirAdmin(){
let c=prompt("Clave:");
if(c==="Rifa2026$Pro"){
document.getElementById("adminPanel").style.display="block";
}
}

function cargar(){
let g=document.getElementById("grid");
for(let i=1;i<=total;i++){
let d=document.createElement("div");
d.className="num libre";
d.innerText=i;
d.onclick=()=>seleccionar(i);
g.appendChild(d);
}
cargarDatos();
}

function seleccionar(n){
let e=document.querySelectorAll(".num")[n-1];

if(e.classList.contains("pendiente")||e.classList.contains("pagado"))return alert("No disponible");

if(seleccionados.includes(n)){
seleccionados=seleccionados.filter(x=>x!==n);
}else{
seleccionados.push(n);
}

actualizarUI();
}

function actualizarUI(){
document.querySelectorAll(".num").forEach(d=>{
let n=parseInt(d.innerText);
d.classList.toggle("seleccionado",seleccionados.includes(n));
});
document.getElementById("totalBox").innerText=
"Seleccionados: "+seleccionados.length+" | Total: $"+(seleccionados.length*precio);
}

function comprar(){
if(seleccionados.length==0)return alert("Selecciona");

let nombre=prompt("Nombre");
let cedula=prompt("Cédula");
let tel=prompt("Teléfono");

if(!nombre||!cedula||!tel)return;

let totalP=seleccionados.length*precio;

seleccionados.forEach(n=>{
db.ref("rifa/"+n).set({nombre,cedula,tel,estado:"pendiente"});
});

document.getElementById("totalPago").innerText=totalP;
document.getElementById("pagoBox").style.display="flex";

seleccionados=[];
actualizarUI();
}

function cargarDatos(){
db.ref("rifa").on("value",snap=>{
let data=snap.val()||{};
let html="";
let c=0;

for(let n in data){
c++;
let d=data[n];

document.querySelectorAll(".num").forEach(x=>{
if(x.innerText==n){
x.className="num "+(d.estado=="pagado"?"pagado":"pendiente");
}
});

html+=`<tr>
<td>${n}</td>
<td>${d.nombre}</td>
<td>${d.cedula}</td>
<td>${d.tel}</td>
<td>${d.estado}</td>
<td><button onclick="marcarPagado(${n})">✅</button></td>
</tr>`;
}

document.getElementById("tabla").innerHTML=html;
document.getElementById("vendidos").innerText=c;
});
}

function buscarNumero(){
let v=document.getElementById("buscadorNumeros").value;
document.querySelectorAll(".num").forEach(n=>{
n.style.display=n.innerText.includes(v)?"block":"none";
});
}

function marcarPagado(n){
db.ref("rifa/"+n).update({estado:"pagado"});
}

function exportarExcel(){
db.ref("rifa").once("value").then(snap=>{
let data=snap.val()||{};
let csv="Numero,Nombre,Cedula,Telefono,Estado\n";
for(let n in data){
let d=data[n];
csv+=`${n},${d.nombre},${d.cedula},${d.tel},${d.estado}\n`;
}
let a=document.createElement("a");
a.href=URL.createObjectURL(new Blob([csv]));
a.download="rifa.csv";
a.click();
});
}

function filtrar(){
let v=document.getElementById("buscador").value.toLowerCase();
document.querySelectorAll("#tabla tr").forEach(tr=>{
tr.style.display=tr.innerText.toLowerCase().includes(v)?"":"none";
});
}

cargar();
</script>

</body>
</html>
